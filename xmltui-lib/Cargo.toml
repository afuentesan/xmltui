[package]
name = "xmltui-lib"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
minijinja = "2.24.0"
ratatui = { version = "0.30.2", features = [ "serde" ] }
regex = "1.13.1"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = [ "derive" ] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = [ "full" ] }
tokio-util = "0.7.19"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
uuid = { version = "1.25.0", features = [ "v4", "serde" ] }
